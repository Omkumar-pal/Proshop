name: Keep Render Server Active

on:
  schedule:
    # Runs every 10 minutes (cron syntax: minute hour day-of-month month day-of-week)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions dashboard

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: |
          echo "Pinging ProShop Render instance..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 https://proshop-rijx.onrender.com/api/health 2>/dev/null || echo "000")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Server is active and responded with 200 OK"
          elif [ "$HTTP_STATUS" -eq 000 ]; then
            echo "⚠️ Server timed out or is waking up from sleep mode"
          else
            echo "⚠️ Server returned status $HTTP_STATUS"
          fi
